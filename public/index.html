<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Math Online Real-time</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background-color: #1e293b; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .lobby-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 20px; }
        .lobby-card { background: #334155; padding: 30px; border-radius: 16px; border: 2px solid #475569; display: flex; flex-direction: column; gap: 15px; width: 320px; text-align: center; }
        .input-box { padding: 10px; border-radius: 8px; border: 1px solid #64748b; background: #1e293b; color: white; font-size: 16px; text-align: center; text-transform: uppercase; }

        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { font-size: 24px; color: #38bdf8; }
        
        /* Scoreboard & Cumulative Timers */
        .score-board { display: flex; gap: 25px; background-color: #334155; padding: 12px 24px; border-radius: 12px; margin-bottom: 10px; font-weight: bold; border: 1px solid #475569; }
        .player-info { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .timer-box { font-size: 18px; color: #ef4444; font-family: monospace; background: #1e293b; padding: 2px 8px; border-radius: 6px; }
        .timer-box.active { color: #22c55e; border: 1px solid #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }

        .game-container { display: flex; flex-direction: column; align-items: center; gap: 12px; background-color: #0f172a; padding: 15px; border-radius: 16px; border: 3px solid #334155; }
        
        .board { display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); gap: 2px; width: min(80vw, 540px); height: min(80vw, 540px); background-color: #334155; padding: 3px; border-radius: 6px; }
        
        .cell { background-color: #e2e8f0; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #1e293b; cursor: pointer; position: relative; }
        .cell.type-3E { background-color: #ef4444; color: #ffffff; }
        .cell.type-2E { background-color: #facc15; color: #1e293b; }
        .cell.type-3P { background-color: #0284c7; color: #ffffff; }
        .cell.type-2P { background-color: #f97316; color: #ffffff; }
        .cell.center-star { background-color: #facc15; color: #ef4444; font-size: 18px; }

        .cell-label { font-size: 9px; text-align: center; line-height: 1; pointer-events: none; }

        .tile { width: 90%; height: 90%; background: linear-gradient(145deg, #fef08a, #fde047); border: 1px solid #ca8a04; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #713f12; position: relative; cursor: pointer; }
        .tile.placed-permanently { background: #cbd5e1; border-color: #94a3b8; color: #334155; }
        .tile.selected { outline: 3px solid #38bdf8; box-shadow: 0 0 8px #38bdf8; }
        .tile .tile-score { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: #854d0e; }

        .rack { display: flex; gap: 6px; background-color: #334155; padding: 8px; border-radius: 10px; min-height: 50px; }
        .rack-slot { width: 38px; height: 42px; background-color: #1e293b; border-radius: 4px; border: 1px dashed #64748b; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .btn { background-color: #22c55e; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background-color: #64748b; cursor: not-allowed; }
        .btn-swap { background-color: #a855f7; color: white; }
        .btn-swap:hover { background-color: #9333ea; }
        
        .status-msg { font-size: 13px; color: #38bdf8; font-weight: bold; height: 18px; }
    </style>
</head>
<body>

    <div id="lobbyModal" class="lobby-overlay">
        <h1 style="color: #38bdf8;">A-Math Online</h1>
        <div class="lobby-card">
            <button class="btn" onclick="createRoom()">สร้างห้องใหม่ (Create Room)</button>
            <hr style="border-color: #475569;">
            <input type="text" id="roomCodeInput" class="input-box" placeholder="กรอกรหัสห้อง 6 หลัก" maxlength="6">
            <button class="btn" style="background-color: #0284c7;" onclick="joinRoom()">เข้าร่วมห้อง (Join)</button>
            <div id="lobbyError" style="color: #ef4444; font-size: 13px;"></div>
        </div>
    </div>

    <div class="header">
        <h1>A-MATH ONLINE</h1>
        <p>รหัสห้อง: <span id="displayRoomCode" style="color: #facc15; font-weight: bold;">-</span> | บทบาท: <span id="displayRole" style="color: #38bdf8;">-</span></p>
    </div>

    <!-- Score & Cumulative Timers -->
    <div class="score-board">
        <div class="player-info">
            <span>คุณ (You)</span>
            <div>คะแนน: <span id="myScore" style="color: #facc15;">0</span></div>
            <div id="myTimer" class="timer-box">10:00</div>
        </div>
        <div style="border-left: 1px solid #64748b; margin: 0 5px;"></div>
        <div class="player-info">
            <span>คู่แข่ง (Opponent)</span>
            <div>คะแนน: <span id="oppScore" style="color: #facc15;">0</span></div>
            <div id="oppTimer" class="timer-box">10:00</div>
        </div>
    </div>

    <div class="game-container">
        <div class="status-msg" id="statusMsg">สร้างหรือเข้าร่วมห้องเพื่อเริ่มเล่น</div>
        <div id="board" class="board"></div>
        <div id="rack" class="rack"></div>
        <div class="controls" style="display: flex; gap: 8px;">
            <button id="submitBtn" class="btn" onclick="submitMove()" disabled>ส่งคำตอบ (PLAY)</button>
            <button id="swapBtn" class="btn btn-swap" onclick="swapTiles()" disabled>สุ่มเบี้ยใหม่ (Swap)</button>
            <button class="btn" style="background-color: #eab308; color: #1e293b;" onclick="recallTiles()">ดึงเบี้ยกลับ</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomCode = null, myRole = null, currentTurn = 'P1';
        let timerInterval = null;
        let timers = { P1: 600, P2: 600 }; // 10 นาที (600 วินาที) ต่อคนแบบ Cumulative

        const BOARD_LAYOUT = [
            ["3E", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "3E", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "3E"],
            ["NORMAL", "2E", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "2E", "NORMAL"],
            ["NORMAL", "NORMAL", "2E", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "2E", "NORMAL", "NORMAL"],
            ["2P", "NORMAL", "NORMAL", "2E", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "2E", "NORMAL", "NORMAL", "2P"],
            ["NORMAL", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "NORMAL"],
            ["NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL"],
            ["NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL"],
            ["3E", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "CENTER", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "3E"],
            ["NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL"],
            ["NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL"],
            ["NORMAL", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "NORMAL"],
            ["2P", "NORMAL", "NORMAL", "2E", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "2E", "NORMAL", "NORMAL", "2P"],
            ["NORMAL", "NORMAL", "2E", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "2E", "NORMAL", "NORMAL"],
            ["NORMAL", "2E", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "3P", "NORMAL", "NORMAL", "NORMAL", "2E", "NORMAL"],
            ["3E", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "NORMAL", "3E", "NORMAL", "NORMAL", "NORMAL", "2P", "NORMAL", "NORMAL", "3E"]
        ];

        let gridState = Array(15).fill(null).map(() => Array(15).fill(null));
        let playerRack = [
            { id: 'f1', symbol: '7', score: 2 }, { id: 'f2', symbol: '+', score: 2 },
            { id: 'f3', symbol: '5', score: 2 }, { id: 'f4', symbol: '=', score: 1 },
            { id: 'f5', symbol: '1', score: 1 }, { id: 'f6', symbol: '2', score: 1 },
            { id: 'f7', symbol: 'x', score: 2 }, { id: 'f8', symbol: '3', score: 1 }
        ];
        
        let placedTilesInTurn = [], selectedTileData = null, myScore = 0;

        function createRoom() { socket.emit('create_room'); }
        function joinRoom() {
            const code = document.getElementById('roomCodeInput').value;
            if (code) socket.emit('join_room', code);
        }

        socket.on('room_created', ({ roomCode, role }) => {
            currentRoomCode = roomCode; myRole = role;
            document.getElementById('displayRoomCode').textContent = roomCode;
            document.getElementById('displayRole').textContent = 'ผู้เล่น 1 (Host)';
            document.getElementById('lobbyModal').style.display = 'none';
        });

        socket.on('room_joined', ({ roomCode, role }) => {
            currentRoomCode = roomCode; myRole = role;
            document.getElementById('displayRoomCode').textContent = roomCode;
            document.getElementById('displayRole').textContent = 'ผู้เล่น 2 (Guest)';
            document.getElementById('lobbyModal').style.display = 'none';
        });

        socket.on('game_start', ({ currentTurn: turn, hand, roomTimers }) => {
            currentTurn = turn;
            if (hand && hand.length > 0) playerRack = hand;
            if (roomTimers) timers = roomTimers;
            initRack();
            updateTurnUI();
            startTimerLoop();
        });

        socket.on('opponent_moved', ({ fullCells, newScore, currentTurn: nextTurn, roomTimers }) => {
            fullCells.forEach(cell => { gridState[cell.row][cell.col] = { tile: cell.tile }; });
            document.getElementById('oppScore').textContent = newScore;
            currentTurn = nextTurn;
            if (roomTimers) timers = roomTimers;
            initBoard();
            updateTurnUI();
        });

        socket.on('hand_swapped', ({ newHand, currentTurn: nextTurn, roomTimers }) => {
            playerRack = newHand;
            currentTurn = nextTurn;
            if (roomTimers) timers = roomTimers;
            initRack();
            updateTurnUI();
        });

        socket.on('timer_update', (roomTimers) => {
            timers = roomTimers;
            renderTimers();
        });

        socket.on('error_msg', (msg) => { document.getElementById('lobbyError').textContent = msg; });

        function startTimerLoop() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timers[currentTurn] > 0) {
                    timers[currentTurn]--;
                    renderTimers();
                } else {
                    document.getElementById('statusMsg').textContent = `⏰ เวลาของ ${currentTurn} หมดลงแล้ว!`;
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        function renderTimers() {
            const formatTime = (sec) => {
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                const s = (sec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const myTime = myRole === 'P1' ? timers.P1 : timers.P2;
            const oppTime = myRole === 'P1' ? timers.P2 : timers.P1;

            const myTimerEl = document.getElementById('myTimer');
            const oppTimerEl = document.getElementById('oppTimer');

            myTimerEl.textContent = formatTime(myTime);
            oppTimerEl.textContent = formatTime(oppTime);

            if (currentTurn === myRole) {
                myTimerEl.classList.add('active');
                oppTimerEl.classList.remove('active');
            } else {
                oppTimerEl.classList.add('active');
                myTimerEl.classList.remove('active');
            }
        }

        function updateTurnUI() {
            const isMyTurn = myRole === currentTurn;
            document.getElementById('submitBtn').disabled = !isMyTurn;
            document.getElementById('swapBtn').disabled = !isMyTurn;
            document.getElementById('statusMsg').textContent = isMyTurn ? '★ ตาของคุณแล้ว! วางเบี้ยได้เลย' : 'รอคู่แข่งวางสมการ...';
            renderTimers();
        }

        function renderCellLabel(cell, cellType) {
            if (cellType === '3E') cell.innerHTML = '<span class="cell-label">3X<br>สมการ</span>';
            else if (cellType === '2E') cell.innerHTML = '<span class="cell-label">2X<br>สมการ</span>';
            else if (cellType === '3P') cell.innerHTML = '<span class="cell-label">3X<br>เบี้ย</span>';
            else if (cellType === '2P') cell.innerHTML = '<span class="cell-label">2X<br>เบี้ย</span>';
            else if (cellType === 'CENTER') {
                cell.className += ' center-star';
                cell.innerHTML = '★';
            } else {
                cell.innerHTML = '';
            }
        }

        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cellType = BOARD_LAYOUT[r][c];
                    const cell = document.createElement('div');
                    cell.className = `cell type-${cellType}`;
                    
                    renderCellLabel(cell, cellType);

                    if (gridState[r][c]) {
                        cell.innerHTML = '';
                        cell.appendChild(createTileEl(gridState[r][c].tile, true));
                    }

                    cell.onclick = () => onCellClick(r, c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function initRack() {
            const rackEl = document.getElementById('rack');
            rackEl.innerHTML = '';
            playerRack.forEach(tileData => {
                const slot = document.createElement('div');
                slot.className = 'rack-slot';
                if (tileData) {
                    const tileEl = createTileEl(tileData, false);
                    if (selectedTileData?.id === tileData.id) tileEl.classList.add('selected');
                    slot.appendChild(tileEl);
                }
                rackEl.appendChild(slot);
            });
        }

        function createTileEl(tileData, isPerm) {
            const tile = document.createElement('div');
            tile.className = `tile ${isPerm ? 'placed-permanently' : ''}`;
            // แสดงเครื่องหมาย x แทน * บนตัวเบี้ย
            const displaySymbol = tileData.symbol === '*' ? 'x' : tileData.symbol;
            tile.innerHTML = `${displaySymbol}<span class="tile-score">${tileData.score}</span>`;
            
            if (!isPerm) {
                tile.onclick = (e) => {
                    e.stopPropagation();
                    if (myRole !== currentTurn) return;
                    selectedTileData = selectedTileData?.id === tileData.id ? null : tileData;
                    initRack();
                };
            }
            return tile;
        }

        function onCellClick(r, c) {
            if (!selectedTileData || myRole !== currentTurn) return;
            if (gridState[r][c] || placedTilesInTurn.some(p => p.row === r && p.col === c)) return;

            const rackIdx = playerRack.findIndex(t => t?.id === selectedTileData.id);
            if (rackIdx !== -1) playerRack[rackIdx] = null;

            placedTilesInTurn.push({ tile: selectedTileData, row: r, col: c });
            gridState[r][c] = { tile: selectedTileData };
            selectedTileData = null;
            initBoard();
            initRack();
        }

        function submitMove() {
            if (placedTilesInTurn.length === 0) return;
            const nextTurn = myRole === 'P1' ? 'P2' : 'P1';
            myScore += 10;
            document.getElementById('myScore').textContent = myScore;

            socket.emit('submit_move', {
                roomCode: currentRoomCode,
                placedTiles: placedTilesInTurn,
                fullCells: placedTilesInTurn,
                newScore: myScore,
                nextTurn: nextTurn,
                timers: timers
            });

            placedTilesInTurn = [];
            currentTurn = nextTurn;
            initBoard();
            updateTurnUI();
        }

        // ฟังก์ชันสุ่มเบี้ยใหม่ (Swap All Tiles)
        function swapTiles() {
            if (myRole !== currentTurn) return;
            recallTiles(); // ดึงเบี้ยที่อาจจะวางบนกระดานกลับลงแท่นก่อน
            const nextTurn = myRole === 'P1' ? 'P2' : 'P1';

            socket.emit('swap_hand', {
                roomCode: currentRoomCode,
                oldHand: playerRack,
                nextTurn: nextTurn,
                timers: timers
            });
        }

        function recallTiles() {
            placedTilesInTurn.forEach(p => {
                gridState[p.row][p.col] = null;
                const emptySlot = playerRack.findIndex(s => s === null);
                if (emptySlot !== -1) playerRack[emptySlot] = p.tile;
            });
            placedTilesInTurn = [];
            initBoard();
            initRack();
        }

        initBoard();
        initRack();
    </script>
</body>
</html>
